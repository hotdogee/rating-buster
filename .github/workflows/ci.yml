name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint and check locales
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # WoW runs Lua 5.1
      - uses: leafo/gh-actions-lua@v13
        with:
          luaVersion: "5.1.5"

      - uses: leafo/gh-actions-luarocks@v6

      - name: Install luacheck
        run: luarocks install luacheck 1.2.0

      - name: luacheck
        run: luacheck .

      - name: Locale check
        run: lua tests/check_locales.lua
